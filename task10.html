<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Finder</title>
  <link rel="stylesheet" href="task10.css" />
</head>
<body>
  <main class="container">
    <h1>University Finder</h1>
    <p class="subtitle">Enter a country name to see its universities.</p>

    <form id="search-form">
      <input
        type="text"
        id="country-input"
        placeholder="e.g. India, Canada, Germany"
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <p id="message" class="message"></p>
    <ul id="results" class="results"></ul>
  </main>
  <script src="task10.js"></script>

</body>
</html>
